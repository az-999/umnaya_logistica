openapi: 3.0.3
info:
  title: Notification Service API
  description: Микросервис массовых уведомлений (SMS/Email)
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local docker-compose
paths:
  /notifications/bulk:
    post:
      summary: Массовая рассылка уведомлений
      operationId: bulkNotifications
      security:
        - ApiKeyAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Ключ идемпотентности для защиты от дублирования запросов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkNotificationRequest'
            examples:
              transactional_sms:
                value:
                  channel: sms
                  message: "Ваш код: 1234"
                  recipient_ids: ["sub-001"]
                  priority: transactional
              marketing_email:
                value:
                  channel: email
                  message: "Скидка 20%!"
                  recipient_ids: ["sub-001", "sub-002"]
                  priority: marketing
      responses:
        '202':
          description: Уведомления приняты в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkNotificationResponse'
        '200':
          description: Дубликат идемпотентного запроса — возвращены существующие уведомления
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkNotificationResponse'
        '401':
          description: Неверный или отсутствующий X-Api-Key
        '422':
          description: Ошибка валидации
        '429':
          description: Превышен лимит уведомлений подписчику (RATE_LIMIT_SUBSCRIBER_PER_HOUR в час)
  /subscribers/{subscriberId}/notifications:
    get:
      summary: История уведомлений подписчика
      operationId: subscriberNotifications
      security:
        - ApiKeyAuth: []
      parameters:
        - name: subscriberId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, sent, delivered, rejected]
        - name: channel
          in: query
          schema:
            type: string
            enum: [sms, email]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Список уведомлений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberNotificationsResponse'
        '401':
          description: Неверный или отсутствующий X-Api-Key
  /notifications/{id}/delivery-callback:
    post:
      summary: Callback подтверждения доставки от провайдера
      operationId: deliveryCallback
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryCallbackRequest'
      responses:
        '200':
          description: Статус обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '401':
          description: Неверный или отсутствующий X-Api-Key
        '404':
          description: Уведомление не найдено
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Фиксированный ключ доступа (API_KEY в .env)
  schemas:
    BulkNotificationRequest:
      type: object
      required: [channel, message, recipient_ids]
      properties:
        channel:
          type: string
          enum: [sms, email]
        message:
          type: string
          maxLength: 5000
        recipient_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
        priority:
          type: string
          enum: [transactional, marketing]
          default: marketing
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subscriber_id:
          type: string
        channel:
          type: string
          enum: [sms, email]
        message:
          type: string
        status:
          type: string
          enum: [queued, sent, delivered, rejected]
        priority:
          type: string
          enum: [transactional, marketing]
        provider_ref:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
    BulkNotificationResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    NotificationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Notification'
    SubscriberNotificationsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
    DeliveryCallbackRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [delivered, rejected]
